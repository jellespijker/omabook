[layers.operations]
summary = "What the command line, the MCP server and the window all do, each written once: book operations, collections, sync, graph and plugin tools."
uses = ["services", "library", "formats", "foundation"]
modules = [
  "bookmatch", "bookops", "chronologyexport", "chronologyops", "collectionimport", "collections", "collectionshare", "following", "graphbatch", "graphchoice", "graphcommands", "graphprint", "graphreading", "graphtools", "keptproposals", "olderpeer", "pairing", "pluginargument", "pluginfilesync", "scriptsession", "pluginpackage", "plugintools",
  "scripttools", "sharedcollection", "sharedkeys", "sharedspaces", "spacecarry", "spacefiles", "subscriptions", "sync", "synclog", "syncmanifest", "synccopies", "syncrenames", "synctake", "synctakeannotations", "synctakecollections", "synctakegraph",
  "noterecognition", "annotationedits", "annotationexport", "pdfannotations", "spaceswitch", "meaningsearch",
  "kosyncroutes", "opdsroutes", "deviceserver", "deviceserving", "serveservice", "koreadersync", "sendbook",
  "hubkeeper", "hubrequests", "hubdaemon", "hubschedule", "hubsnapshots",
]

# The two front ends are peers: neither includes the other. What both need
# belongs in operations or below.
[layers.commands]
summary = "The command line and the MCP server."
uses = ["operations", "services", "library", "formats", "foundation"]
modules = ["aicommands", "annotationcommands", "annotationtools", "bookmarkcommands", "chronologycommands", "chronologyprint", "chronologytools", "cli", "clisummary", "identitycommands", "logcommands", "mcp", "readingcommands", "readingtools", "mcpcommands", "spacecommands", "spacetools", "synccommands", "findcommands", "meaningtools", "bookfilecommands", "bookfiletools", "devicecommands", "hubcommands", "librariescommands", "snapshotcommands"]

[layers.window]
summary = "The window: QML-facing models, the reader, the assistant and the dialogs' back ends."
uses = ["operations", "services", "library", "formats", "foundation"]
modules = [
  "assistant", "backend", "backendcollections", "backendlookup", "backendpicker", "backendsync", "booklistmodel", "graphcanvas", "graphjobs", "graphmodel",
  "chronologycanvas", "chronologycard", "chronologyframe", "chronologymodel", "chronologyproposals", "graphtenants", "graphtypes",
  "interface", "librarian", "librarianfind", "libraryupgrade", "pageformat", "pluginmanager", "portalfilepicker", "reader", "readingmarks", "readingpassages", "marginnotes", "spacedesk",
  "inksurface", "inksurfacetouch", "inksurfacecover", "inknodes", "inkselection", "readinghighlights", "readingink", "readinglineink", "backendplugins", "annotationfinder", "readingselection",
  "readingstatsview", "annotationlayerview", "meaningfinder", "plugindesk", "devicedesk", "qrview", "backenddetails",
  "readaloud", "linkinbox", "installterminal", "speechinstall", "dictationkeys", "transcriptdesk", "heldkeys",
]

[layers.app]
summary = "main(): wires everything together."
uses = ["window", "commands", "operations", "services", "library", "formats", "foundation"]
modules = ["main"]

[qt]
# Qt Quick and QML belong to the window: a library or a format that includes
# them can't be used without one. QJSEngine (script plugins) is not QML.
window_only = ["QQuick", "QQml"]
allowed_in = ["window", "app"]
