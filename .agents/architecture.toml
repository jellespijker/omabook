  "annotationink", "lineink", "opkinds", "keptops",
  "booksearch", "annotationwords", "meaningindex", "bookwords",
  "readinglog", "readingstats", "readinggoal",
  "spaceparts", "spaceannotations", "heldspaces", "annotationlayers", "annotationfacts", "membernames",
