name: Harness

# The checks the hooks run locally (.agents/rules/00-harness.md), on everything
# a pull request or a push changes, so a commit made without the hooks is
# still checked. Only what the change adds is judged.
on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  harness:
    name: Harness checks
    runs-on: ubuntu-latest
    # Arch, like the Test workflow: the same clang-format and clang-tidy as a desktop.
    container: archlinux:latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Install git for the checkout
        run: pacman -Syu --noconfirm --needed git

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install the build's and the harness's tools
        run: |
          pacman -S --noconfirm --needed base-devel cmake pkgconf python uv clang ast-grep \
            qt6-base qt6-declarative qt6-svg qt6-wayland libarchive poppler-qt6 libsodium
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Choose what to compare with
        id: base
        run: |
          if [[ "${{ github.event_name }}" == pull_request ]]; then
            echo "ref=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.before }}" =~ ^0+$ ]]; then
            echo "ref=HEAD~1" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          fi

      - name: The harness's own tests
        run: |
          python3 .agents/hooks/test_hooks.py
          ast-grep test --skip-snapshot-tests

      - name: Build, for clang-tidy's compile commands
        run: bin/build

      - name: Check the change
        run: bin/check "${{ steps.base.outputs.ref }}"
