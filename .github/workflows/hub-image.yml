name: Hub image

# The hub as a container (#195): packaging/container/Containerfile, built for
# x86_64 and aarch64, each on a runner of its own kind (no emulation: a C++
# build under QEMU takes hours). The x86_64 image is tested whole before
# anything is published (packaging/container/test-hub.sh: it starts, a
# computer in another container links to it over ssh and syncs, a snapshot is
# taken and a book restored from it); the aarch64 one is started and asked
# what it runs. On a version tag both are pushed to GHCR by digest and joined
# under one name, ghcr.io/jellespijker/omabook-hub:<version> and :latest.
#
# A pull request or a push to main that changes the image builds and tests it,
# and publishes nothing; so does a run by hand.

on:
  push:
    tags: ['v*']
    branches: [main, master]
    paths: ['packaging/container/**', '.github/workflows/hub-image.yml']
  pull_request:
    paths: ['packaging/container/**', '.github/workflows/hub-image.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/jellespijker/omabook-hub

jobs:
  image:
    name: Build and test the hub image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build it
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/container/Containerfile
          platforms: ${{ matrix.platform }}
          load: true
          tags: omabook-hub:test
          cache-from: type=gha,scope=hub-${{ matrix.arch }}
          cache-to: type=gha,scope=hub-${{ matrix.arch }},mode=max

      - name: Say what it runs
        run: |
          docker run --rm --entrypoint omabook omabook-hub:test --version
          docker run --rm --entrypoint restic omabook-hub:test version
          docker image inspect omabook-hub:test --format 'User {{.Config.User}}, {{.Architecture}}, {{.Size}} bytes'
          test "$(docker image inspect omabook-hub:test --format '{{.Config.User}}')" = omabook

      - name: Start it, and see sshd and the daemon answer
        if: matrix.arch != 'x86_64'
        run: packaging/container/test-hub.sh --start-only omabook-hub:test

      - name: Link a computer, sync, take a snapshot and restore from it
        if: matrix.arch == 'x86_64'
        run: packaging/container/test-hub.sh omabook-hub:test

      - name: Sign in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push it by its digest
        id: push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/container/Containerfile
          platforms: ${{ matrix.platform }}
          # The same build as above, from its cache.
          cache-from: type=gha,scope=hub-${{ matrix.arch }}
          labels: org.opencontainers.image.version=${{ github.ref_name }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Keep the digest for the manifest
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: hub-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ghcr.io/jellespijker/omabook-hub
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: hub-digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Join both under the version and latest
        working-directory: ${{ runner.temp }}/digests
        run: |
          version="${GITHUB_REF_NAME#v}"
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          (( ${#sources[@]} == 2 )) || { echo "expected two digests, got: ${sources[*]}"; exit 1; }
          docker buildx imagetools create -t "$IMAGE:$version" -t "$IMAGE:latest" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:$version"
