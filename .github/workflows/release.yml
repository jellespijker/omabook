name: Release

# On a version tag: build the Arch package in a clean container, run the
# tests inside the package build, and attach the package to the GitHub
# release, so it installs with `pacman -U <url>`. The same job keeps a small
# pacman repository on the release tagged `repo`, so `pacman -Syu` brings
# updates once that repository is added to pacman.conf. The repository is
# signed when the OMABOOK_REPO_KEY secret holds a signing key; without it
# the packages are still attached, but the repository is left alone, since
# an unsigned third-party repository asks people to switch off a check.
#
# Both jobs build packaging/omarchy-pkgs/PKGBUILD, the recipe proposed to
# omacom/omarchy-pkgs. The package job builds it from the checked-out tag and
# publishes that package; the recipe job builds it exactly as omarchy-pkgs'
# builder does (the tag's tarball from GitHub, in a clean archlinux:latest
# with en_US.UTF-8) and attaches the filled-in recipe, its check() summary and
# the package's size, so the omarchy-pkgs pull request can be brought up to
# date without building it by hand.

on:
  push:
    tags: ['v*']
  # A dry run from any branch: both builds, nothing published. The recipe job
  # then builds the given tag (the newest one when empty) with this branch's recipe.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag whose source the omarchy-pkgs recipe builds (default the newest v* tag)
        required: false

permissions:
  contents: write

jobs:
  package:
    name: Build and publish the package
    runs-on: ubuntu-latest
    container: archlinux:latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Install the tools
        run: pacman -Syu --noconfirm --needed git base-devel pacman-contrib github-cli gnupg

      - uses: actions/checkout@v4

      - name: Write the recipe
        # packaging/omarchy-pkgs/PKGBUILD, building the checked-out tree instead of downloading the tag.
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; else version="0.0.0.dry$GITHUB_RUN_NUMBER"; fi
          mkdir -p "$RUNNER_TEMP/pkg"
          sed "s/^pkgver=.*/pkgver=$version/" packaging/omarchy-pkgs/PKGBUILD > "$RUNNER_TEMP/pkg/PKGBUILD"
          cat >> "$RUNNER_TEMP/pkg/PKGBUILD" <<EOF

          source=()
          sha256sums=()
          prepare() {
            cp -r "$GITHUB_WORKSPACE" "\$srcdir/\$pkgname-\$pkgver"
            rm -rf "\$srcdir/\$pkgname-\$pkgver/build" "\$srcdir/\$pkgname-\$pkgver/.git"
          }
          EOF

      - name: Build the package, tests included
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          sed -i 's/^#en_US.UTF-8/en_US.UTF-8/' /etc/locale.gen && locale-gen
          chown -R builder "$RUNNER_TEMP/pkg" "$GITHUB_WORKSPACE"
          cd "$RUNNER_TEMP/pkg"
          su builder -c 'LANG=en_US.UTF-8 makepkg --syncdeps --noconfirm'
          ls -la ./*.pkg.tar.zst

      - name: Attach it to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/pkg"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # The recipe job may be creating the release at the same moment.
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Omabook ${GITHUB_REF_NAME#v}" --generate-notes \
            || gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber omabook-*.pkg.tar.zst

      - name: Bring the signed repository up to date
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_KEY: ${{ secrets.OMABOOK_REPO_KEY }}
        if: startsWith(github.ref, 'refs/tags/v') && env.REPO_KEY != ''
        run: |
          cd "$RUNNER_TEMP/pkg"
          export GNUPGHOME="$RUNNER_TEMP/gnupg" && mkdir -m 700 "$GNUPGHOME"
          printf '%s\n' "$REPO_KEY" | gpg --batch --import
          key=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')
          gh release view repo --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create repo --repo "$GITHUB_REPOSITORY" --title "Package repository" --latest=false \
                 --notes "The pacman repository for Omabook. See the README, Install, to add it."
          # The database so far, so older versions stay installable.
          gh release download repo --repo "$GITHUB_REPOSITORY" --pattern 'omabook.db.tar.gz' --pattern 'omabook.files.tar.gz' || true
          for package in omabook-*.pkg.tar.zst; do
            gpg --batch --yes --local-user "$key" --detach-sign --no-armor "$package"
          done
          repo-add --sign --key "$key" omabook.db.tar.gz omabook-*.pkg.tar.zst
          # pacman asks for the names without .tar.gz; GitHub doesn't keep
          # links, so those are copies.
          for name in db files; do
            cp "omabook.$name.tar.gz" "omabook.$name"
            cp "omabook.$name.tar.gz.sig" "omabook.$name.sig"
          done
          gpg --armor --export "$key" > omabook-repo.asc
          gh release upload repo --repo "$GITHUB_REPOSITORY" --clobber \
            omabook-*.pkg.tar.zst omabook-*.pkg.tar.zst.sig \
            omabook.db omabook.db.sig omabook.db.tar.gz omabook.db.tar.gz.sig \
            omabook.files omabook.files.sig omabook.files.tar.gz omabook.files.tar.gz.sig omabook-repo.asc

  recipe:
    name: Build the omarchy-pkgs recipe
    runs-on: ubuntu-latest
    container: archlinux:latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Install the tools
        run: pacman -Syu --noconfirm --needed git base-devel github-cli

      - uses: actions/checkout@v4

      - name: Fill in the recipe
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          elif [[ -z $TAG ]]; then
            tag=$(git ls-remote --tags --refs "https://github.com/$GITHUB_REPOSITORY" 'v*' | sed 's|.*refs/tags/||' | sort -V | tail -1)
          else
            tag="$TAG"
          fi
          version="${tag#v}"
          curl -fsSL "https://github.com/$GITHUB_REPOSITORY/archive/refs/tags/$tag.tar.gz" -o "$RUNNER_TEMP/source.tar.gz"
          sum=$(sha256sum "$RUNNER_TEMP/source.tar.gz" | cut -d' ' -f1)
          mkdir -p "$RUNNER_TEMP/out" "$RUNNER_TEMP/recipe"
          sed -e "s/^pkgver=.*/pkgver=$version/" -e "s/^sha256sums=.*/sha256sums=('$sum')/" \
            packaging/omarchy-pkgs/PKGBUILD > "$RUNNER_TEMP/out/PKGBUILD"
          grep -qx "pkgver=$version" "$RUNNER_TEMP/out/PKGBUILD" && grep -q "$sum" "$RUNNER_TEMP/out/PKGBUILD"
          cp packaging/omarchy-pkgs/.omarchy/package.json "$RUNNER_TEMP/out/omarchy-package.json"
          # makepkg downloads the source itself and checks it against the sum, as omarchy-pkgs does.
          cp "$RUNNER_TEMP/out/PKGBUILD" "$RUNNER_TEMP/recipe/"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "== $tag: sha256 $sum"

      - name: Build it as omarchy-pkgs' builder does
        # The dependencies installed by pacman, then makepkg as an ordinary user, in en_US.UTF-8.
        run: |
          sed -i 's/^#en_US.UTF-8/en_US.UTF-8/' /etc/locale.gen && locale-gen
          export LANG=en_US.UTF-8
          source "$RUNNER_TEMP/recipe/PKGBUILD"
          pacman -S --noconfirm --needed "${depends[@]}" "${makedepends[@]}" "${checkdepends[@]}"
          useradd -m builder
          chown -R builder "$RUNNER_TEMP/recipe"
          cd "$RUNNER_TEMP/recipe"
          set -o pipefail
          su builder -c 'LANG=en_US.UTF-8 makepkg --noconfirm' 2>&1 | tee "$RUNNER_TEMP/makepkg.log"

      - name: Summarise the check and the package
        if: always()
        run: |
          cd "$RUNNER_TEMP/out"
          {
            echo "omabook ${TAG:-?}: makepkg of the omarchy-pkgs recipe in archlinux:latest, $(date -u +%F)"
            grep -E '% tests passed|tests failed out of|Total Test time|The following tests|\*\*\*(Failed|Timeout|Exception)|^[[:space:]]+[0-9]+ - .*\(' "$RUNNER_TEMP/makepkg.log" || echo "no ctest summary: the build stopped before check()"
          } > check-summary.txt
          if compgen -G "$RUNNER_TEMP/recipe/omabook-*.pkg.tar.zst" >/dev/null; then
            pkg=$(ls "$RUNNER_TEMP"/recipe/omabook-*.pkg.tar.zst)
            {
              echo "$(basename "$pkg"): $(stat -c %s "$pkg") bytes compressed ($(du -h "$pkg" | cut -f1))"
              pacman -Qip "$pkg" | grep -E '^(Installed Size)'
            } > package-size.txt
          fi
          cat ./*.txt

      - name: Keep them with the run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omarchy-pkgs-recipe
          path: ${{ runner.temp }}/out/

      - name: Attach them to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/out"
          # The package job may be creating the release at the same moment.
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Omabook ${GITHUB_REF_NAME#v}" --generate-notes \
            || gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
            PKGBUILD omarchy-package.json check-summary.txt package-size.txt
