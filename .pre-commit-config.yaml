# The harness, run by git: `uvx pre-commit install` once per clone (it installs
# the pre-commit and commit-msg hooks). CI runs the same checks
# (.github/workflows/harness.yml). What each check is for: .agents/rules/.
#
# The project's own checks look only at what a commit adds (they compare the
# index with HEAD), so old code that predates a rule never blocks a commit.
# Never skip them with --no-verify; fix what they say, or say in the code why not.
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1500"]
      - id: detect-private-key

  - repo: https://github.com/thoughtworks/talisman
    rev: v1.37.0
    hooks:
      - id: talisman-commit

  - repo: local
    hooks:
      - id: commit-names-an-issue
        name: Commit message names a GitHub issue
        entry: python3 .agents/hooks/check_commit_msg.py
        language: system
        stages: [commit-msg]

      - id: clang-format
        name: clang-format (changed lines)
        entry: python3 .agents/hooks/check_format.py --staged
        language: system
        pass_filenames: false
        types_or: [c++]

      - id: ast-grep
        name: Structural C++ rules (rules/cpp, new lines)
        entry: python3 .agents/hooks/check_ast_grep.py --staged
        language: system
        pass_filenames: false
        types_or: [c++]

      - id: ast-grep-rule-tests
        name: The structural rules' own cases (rule-tests)
        entry: bash -c 'if command -v ast-grep >/dev/null; then ast-grep test --skip-snapshot-tests; else uvx --from ast-grep-cli==0.51.1 ast-grep test --skip-snapshot-tests; fi'
        language: system
        pass_filenames: false
        files: ^(sgconfig\.yml|rules/|rule-tests/)

      - id: architecture
        name: Architecture layers (.agents/architecture.toml)
        entry: python3 .agents/hooks/check_architecture.py --staged
        language: system
        pass_filenames: false
        files: ^(src/|\.agents/architecture)

      - id: ruff
        name: ruff (new lines; new files formatted)
        entry: python3 .agents/hooks/check_python.py --staged
        language: system
        pass_filenames: false
        types_or: [python]

      - id: file-size
        name: File-size budget and ratchet
        entry: python3 .agents/hooks/check_file_size.py --staged
        language: system
        pass_filenames: false

      - id: complexity
        name: Function complexity budget (lizard)
        entry: python3 .agents/hooks/check_complexity.py --staged
        language: system
        pass_filenames: false
        types_or: [c++, javascript, python]

      - id: clang-tidy
        name: clang-tidy (new lines; needs a build)
        entry: python3 .agents/hooks/check_clang_tidy.py --staged
        language: system
        pass_filenames: false
        types_or: [c++]

      - id: harness-tests
        name: The harness's own tests
        entry: python3 .agents/hooks/test_hooks.py
        language: system
        pass_filenames: false
        files: ^(\.agents/|rules/|sgconfig\.yml|\.clang-format|ruff\.toml)
