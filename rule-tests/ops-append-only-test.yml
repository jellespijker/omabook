id: ops-append-only
valid:
  - 'auto q = query("SELECT space, device, seq FROM ops ORDER BY seq");'
  - 'exec("INSERT INTO ops (space, device, seq) VALUES (?, ?, ?)");'
  - 'exec("INSERT OR IGNORE INTO ops (space, device, seq) VALUES (?, ?, ?)");'
  - 'exec("DELETE FROM log_dirty");'
  - 'exec("UPDATE snapshot_ops SET seq = ?");'
invalid:
  - 'void rewrite(Library &l) { l.exec("UPDATE ops SET hlc = ? WHERE id = ?"); }'
  - 'void replace(Library &l) { l.exec("UPDATE OR IGNORE ops SET value = ?"); }'
