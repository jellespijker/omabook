id: ops-append-only
language: cpp
severity: error
message: The change log (`ops`) is append-only; never UPDATE ops (ADR 0001).
note: |
  Every operation in `ops` is immutable once written. A later or backdated
  change appends a new operation rather than rewriting an existing one.
  Removing operations is compaction's alone (ops-deleted-only-by-compaction).
rule:
  kind: string_literal
  regex: '(?i)\bUPDATE(\s+OR\s+\w+)?\s+ops\b'
